<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STOCK CALLZY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Permanent+Marker&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Permanent Marker', cursive, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 50%, rgba(0, 150, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 150, 0.15), transparent 40%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 200, 0.1), transparent 50%);
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            pointer-events: none;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Caveat', cursive;
            font-size: 30px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
            transition: opacity 0.5s;
        }
        .loading.hide { opacity: 0; pointer-events: none; }

        .admin-toggle {
            position: fixed;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            opacity: 0.15;
            cursor: pointer;
            z-index: 999;
            transition: opacity 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #fff;
        }
        .admin-toggle:hover { opacity: 0.5; }
        .admin-toggle.logged-in {
            opacity: 1;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,255,136,0.8);
            color: #000;
        }

        .admin-badge {
            display: none;
            position: fixed;
            top: 8px;
            right: 45px;
            background: #00ff88;
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            z-index: 999;
            box-shadow: 0 0 15px rgba(0,255,136,0.6);
            font-family: 'Permanent Marker', cursive;
        }
        .admin-badge.show { display: block; }

        #view-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile-pic {
            width: 130px;
            height: 130px;
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            transition: 0.3s;
            background: rgba(0,0,0,0.5);
            cursor: default;
        }
        body.admin-mode .profile-pic { cursor: pointer; }
        body.admin-mode .profile-pic:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }

        .profile-pic img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }
        .profile-pic input[type="file"] { display: none; }

        .profile-name {
            font-family: 'Caveat', cursive;
            font-size: 45px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
            outline: none;
            padding: 5px 15px;
            border-radius: 5px;
            transition: 0.3s;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
        }
        body.admin-mode .profile-name {
            border: 2px dashed rgba(255,255,255,0.5);
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
        }
        body.admin-mode .profile-name:focus {
            border: 2px solid #00ff88;
            background: rgba(0,255,136,0.1);
        }

        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .btn-menu {
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 22px;
            font-size: 24px;
            font-family: 'Permanent Marker', cursive;
            cursor: pointer;
            text-align: center;
            transform: rotate(-1deg);
            transition: 0.3s;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            letter-spacing: 2px;
        }
        .btn-menu:nth-child(2) { transform: rotate(1deg); }
        .btn-menu:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            transform: scale(1.03) rotate(0deg);
        }

        #view-stock { display: none; width: 100%; }

        .header-stock {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
            min-height: 30px;
        }

        .btn-dots {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Permanent Marker', cursive;
            transition: 0.3s;
            display: none;
        }
        body.admin-mode .btn-dots { display: block; }
        .btn-dots:hover { text-shadow: 0 0 15px #fff; }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 20px;
            top: 60px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 10px;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
        }
        .dropdown-menu button {
            display: block;
            background: transparent;
            color: #fff;
            border: none;
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            padding: 12px 15px;
            cursor: pointer;
            width: 100%;
            text-align: left;
            border-radius: 5px;
            transition: 0.2s;
        }
        .dropdown-menu button:hover {
            background: #fff;
            color: #000;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stock-item {
            border: 3px solid #fff;
            border-radius: 8px;
            height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 10px;
            cursor: pointer;
            position: relative;
            background-size: cover;
            background-position: center;
            transform: rotate(-1deg);
            transition: 0.3s;
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .stock-item:nth-child(even) { transform: rotate(1deg); }
        .stock-item:hover {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transform: scale(1.03) rotate(0deg);
            border-color: #00ffff;
        }
        .stock-item::before {
            content: "X";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            color: rgba(255,255,255,0.1);
            z-index: 1;
        }
        .stock-item.has-image::before { display: none; }

        .stock-label {
            background: rgba(0,0,0,0.8);
            padding: 10px;
            text-align: center;
            font-size: 20px;
            z-index: 2;
            border-top: 2px solid #fff;
            letter-spacing: 1px;
        }

        #view-detail {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            width: 100%;
        }
        .detail-image-box {
            width: 100%;
            height: 450px;
            border: 3px solid #fff;
            border-radius: 10px;
            margin-bottom: 30px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 120px;
            color: rgba(255,255,255,0.1);
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
        .detail-image-box.has-image { color: transparent; }

        .btn-order {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 3px solid #fff;
            border-radius: 8px;
            padding: 18px 50px;
            font-size: 26px;
            font-family: 'Permanent Marker', cursive;
            cursor: pointer;
            transform: rotate(-2deg);
            transition: 0.3s;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }
        .btn-order:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
            transform: scale(1.05) rotate(0deg);
        }

        .btn-back {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: transparent;
            border: none;
            font-size: 30px;
            cursor: pointer;
            font-family: 'Permanent Marker', cursive;
            z-index: 100;
            transition: 0.3s;
        }
        .btn-back:hover {
            text-shadow: 0 0 20px #fff;
            transform: translateX(-5px);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: rgba(20,20,20,0.95);
            border: 3px solid #fff;
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 0 40px rgba(255,255,255,0.3);
            text-align: center;
        }
        .modal-box h2 {
            font-family: 'Permanent Marker', cursive;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255,255,255,0.6);
        }
        .modal-box input {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #fff;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-family: 'Permanent Marker', cursive;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
        }
        .modal-box input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0,255,136,0.5);
        }
        .modal-box button {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Permanent Marker', cursive;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-login {
            background: #00ff88;
            color: #000;
            border: none;
        }
        .btn-login:hover {
            box-shadow: 0 0 25px rgba(0,255,136,0.8);
            transform: scale(1.03);
        }
        .btn-cancel {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
        }
        .btn-cancel:hover {
            background: #fff;
            color: #000;
        }
        .error-msg {
            color: #ff3355;
            font-size: 13px;
            margin-bottom: 10px;
            min-height: 18px;
            font-family: 'Permanent Marker', cursive;
        }

    </style>
</head>
<body>

    <div class="loading hide" id="loadingScreen">Memuat data...</div>

    <div class="admin-toggle" id="adminToggle" onclick="handleAdminClick()" title=".">•</div>
    <div class="admin-badge" id="adminBadge">ADMIN</div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-box">
            <h2>🔐 LOGIN ADMIN</h2>
            <div class="error-msg" id="errorMsg"></div>
            <input type="password" id="passwordInput" placeholder="password" onkeypress="if(event.key==='Enter') tryLogin()">
            <button class="btn-login" onclick="tryLogin()">MASUK</button>
            <button class="btn-cancel" onclick="closeLogin()">BATAL</button>
        </div>
    </div>

    <div class="app-container">
        
        <div id="view-main">
            <div class="profile-section">
                <label class="profile-pic" for="profile-upload" id="profilePicLabel">
                    <span id="profile-placeholder">😊</span>
                    <img id="profile-img" src="" alt="Profile">
                    <input type="file" id="profile-upload" accept="image/*" disabled>
                </label>
                <h1 class="profile-name" id="profile-name-display" contenteditable="false">CALLZY</h1>
            </div>

            <div class="menu-buttons">
                <button class="btn-menu" onclick="openStock('FF')">STOCK FF</button>
                <button class="btn-menu" onclick="openStock('ML')">STOCK ML</button>
            </div>
        </div>

        <div id="view-stock">
            <button class="btn-back" onclick="goBack('main')">←</button>
            
            <div class="header-stock">
                <button class="btn-dots" onclick="toggleDropdown()">⋮</button>
                <div class="dropdown-menu" id="dropdown">
                    <button onclick="addStockPhoto()">+ Tambah Foto Stock</button>
                    <button onclick="deleteStockPhoto()">- Hapus Foto Stock</button>
                </div>
            </div>

            <div class="stock-grid" id="stock-grid"></div>
        </div>

        <div id="view-detail">
            <button class="btn-back" onclick="goBack('stock')">←</button>
            <div class="detail-image-box" id="detail-image">X</div>
            <button class="btn-order" id="btn-order-action">order</button>
        </div>

    </div>

    <script>
        // ========== KONFIGURASI ==========
        const WA_NUMBER = "6285895196739";    // 👈 GANTI NOMOR WA ANDA
        const ADMIN_PASSWORD = "callzy123";    // 👈 GANTI PASSWORD ADMIN
        const JUMLAH_STOCK = 6;                // 👈 JUMLAH SLOT STOCK

        // ========== STATE ==========
        let isAdmin = false;
        let currentStockType = 'FF';
        let stockData = { 'FF': {}, 'ML': {} };
        let profileData = { name: "CALLZY", photo: "" };
        let tapCount = 0;
        let tapTimer = null;

        // ========== LOAD DATA dari LocalStorage ==========
        function loadData() {
            try {
                const savedStock = localStorage.getItem('callzy_stock');
                if (savedStock) stockData = JSON.parse(savedStock);

                const savedProfile = localStorage.getItem('callzy_profile');
                if (savedProfile) profileData = JSON.parse(savedProfile);
            } catch(e) { console.log("Load error", e); }
            applyProfile();
        }

        // ========== SAVE DATA ke LocalStorage ==========
        function saveData() {
            try {
                localStorage.setItem('callzy_stock', JSON.stringify(stockData));
                localStorage.setItem('callzy_profile', JSON.stringify(profileData));
            } catch(e) {
                console.log("Save error", e);
                alert("Gagal simpan. Mungkin memori penuh.");
            }
        }

        function applyProfile() {
            document.getElementById('profile-name-display').innerText = profileData.name;
            document.title = "STOCK " + profileData.name;
            
            const img = document.getElementById('profile-img');
            const placeholder = document.getElementById('profile-placeholder');
            if (profileData.photo) {
                img.src = profileData.photo;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            }
        }

        // ========== ADMIN LOGIN ==========
        window.handleAdminClick = function() {
            if (isAdmin) {
                if (confirm("Keluar dari mode Admin?")) {
                    isAdmin = false;
                    document.body.classList.remove('admin-mode');
                    document.getElementById('adminToggle').classList.remove('logged-in');
                    document.getElementById('adminBadge').classList.remove('show');
                    document.getElementById('profile-upload').disabled = true;
                    document.getElementById('profile-name-display').setAttribute('contenteditable', 'false');
                    alert("Logout berhasil.");
                }
            } else {
                document.getElementById('loginModal').classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('errorMsg').innerText = '';
                setTimeout(() => document.getElementById('passwordInput').focus(), 100);
            }
        }

        window.tryLogin = function() {
            const input = document.getElementById('passwordInput').value;
            if (input === ADMIN_PASSWORD) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                document.getElementById('adminToggle').classList.add('logged-in');
                document.getElementById('adminBadge').classList.add('show');
